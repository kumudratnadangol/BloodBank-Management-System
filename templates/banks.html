{% extends "base.html" %}
{% load static %}
{% block title %}Blood Banks{% endblock %}

{% block content %}
<h1>Blood Banks</h1>

<form id="bankForm">
    <h3 id="formTitle">Add New Blood Bank</h3>
    <input type="hidden" id="bankId">

    <label>Name</label>
    <input type="text" id="name" required>

    <label>Location</label>
    <input type="text" id="location" required>

    <label>Contact</label>
    <input type="text" id="contact" required>

    <button type="submit">Save Blood Bank</button>
</form>

<table>
    <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Location</th>
            <th>Contact</th>
            <th>Actions</th>
        </tr>
    </thead>
    <tbody id="bankTableBody">
    </tbody>
</table>
{% endblock %}

{% block scripts %}
<script src="{% static 'js/banks.js' %}"></script>
{% endblock %}
